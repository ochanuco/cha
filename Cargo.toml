[workspace]
resolver = "2"
members = ["crates/cha-core", "crates/cha-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
